ize:13px;text-align:center;box-sizing:border-box"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg>[ภาพประกอบแผน]</span><span style="font-weight:700;font-size:22px">Unit Linked</span><span style="color:#4A4E57">คุ้มครองชีวิตพร้อมลงทุนในกองทุน ปรับพอร์ตได้</span><span style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><span style="padding:4px 12px;background:#FFFFFF;border:1px solid #ECE8E4;border-radius:999px;font-size:13px">ยืดหยุ่น</span><span style="padding:4px 12px;background:#FFFFFF;border:1px solid #ECE8E4;border-radius:999px;font-size:13px">ผลตอบแทนไม่การันตี</span></span></a></div></section><section style="background:#FFFFFF;padding:88px 0"><div style="max-width:1000px;margin:0 auto;padding:0 24px;text-align:center"><h2 style="margin:0 0 12px;font-weight:700;font-size:clamp(28px, 3vw, 40px)">สร้างแผนเหมือนสร้างบ้าน</h2><p style="margin:0 0 40px;color:#4A4E57">เริ่มจากฐานที่มั่นคงก่อน แล้วค่อยต่อเติม</p><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="width:min(100%, 520px);background:#F6F4F2;border-radius:999px;padding:18px 24px;font-weight:600">หลังคา · สะสมทรัพย์ / บำนาญ / Unit Linked</div><div style="width:min(100%, 720px);background:#F6F4F2;border-radius:999px;padding:18px 24px;font-weight:600">ผนัง · ประกันชีวิต (ตลอดชีพ หรือ Term)</div><div style="width:min(100%, 920px);background:{{accent}};color:#FFFFFF;border-radius:999px;padding:18px 24px;font-weight:600">ฐานราก · ประกันสุขภาพ + โรคร้ายแรง</div></div></div></section><section style="max-width:1200px;margin:0 auto;padding:88px 24px"><div style="background:{{accent}};color:#FFFFFF;border-radius:40px;padding:clamp(36px, 5vw, 64px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px"><div style="flex:1 1 420px;min-width:0"><h2 style="margin:0 0 8px;font-weight:700;font-size:clamp(28px, 3vw, 40px)">อยากให้ช่วยเลือกให้?</h2><p style="margin:0;font-size:17px">เล่าสั้น ๆ ทาง LINE แล้วเราจะเสนอ 2–3 ทางเลือกให้เทียบ</p></div><a href="/contact" style="display:inline-flex;align-items:center;min-height:56px;box-sizing:border-box;padding:16px 30px;background:#FFFFFF;color:#1C1D21;border-radius:999px;text-decoration:none;font-weight:600;font-size:17px">แอด LINE [@lineid]</a></div></section><footer style="background:#1C1D21;color:#D9D6D2;font-size:13px"><div style="max-width:1200px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:6px"><strong style="font-size:18px;color:#FFFFFF">พัด ดูแลประกัน</strong><span>[ชื่อ-นามสกุล] · รหัสตัวแทน [—] · ใบอนุญาต [—] · IC License [—]</span><span>ประกันมีความเสี่ยง ผู้ซื้อควรทำความเข้าใจรายละเอียดความคุ้มครองและเงื่อนไขก่อนตัดสินใจทำประกันภัยทุกครั้ง</span><span>เว็บไซต์ส่วนตัวของตัวแทน ไม่ใช่เว็บไซต์ทางการของ [ชื่อบริษัทประกัน]</span></div></footer></div></template><script id="c" type="text/plain">class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { stage: 'family', worry: 'health' };
}
renderVals() {
const base = 'min-height: 48px; padding: 12px 22px; border-radius: 999px; font-family: inherit; font-size: 16px; cursor: pointer; ';
const on = 'background: #1C1D21; color: #FFFFFF; border: 2px solid #1C1D21;';
const off = 'background: #FFFFFF; color: #1C1D21; border: 2px solid #ECE8E4;';
const chips = (items, key) => items.map((it) => {
const sel = this.state[key] === it.id;
return { label: it.label, pressed: sel ? 'true' : 'false', style: base + (sel ? on : off), pick: () => this.setState({ [key]: it.id }) };
});
const stages = chips([
{ id: 'single', label: 'โสด / เพิ่งเริ่มทำงาน' },
{ id: 'family', label: 'มีครอบครัว / มีภาระ' },
{ id: 'retire', label: 'ใกล้เกษียณ' }
], 'stage');
const worries = chips([
{ id: 'health', label: 'ค่ารักษาพยาบาล' },
{ id: 'family', label: 'คนข้างหลัง' },
{ id: 'save', label: 'เงินออม / เกษียณ' }
], 'worry');
const st = this.state.stage;
const wo = this.state.worry;
let main;
if (wo === 'health') {
main = { name: 'ประกันสุขภาพ', why: 'ฐานที่ทุกคนควรมี กันเงินเก็บไม่ให้หายไปกับค่ารักษา' };
} else if (wo === 'family') {
main = st === 'family'
? { name: 'Term + ตลอดชีพ', why: 'Term ให้ทุนสูงช่วงมีภาระ ตลอดชีพเป็นฐานระยะยาว' }
: st === 'single'
? { name: 'ประกันชีวิตตลอดชีพ', why: 'เริ่มตอนอายุน้อย เบี้ยถูกกว่า ล็อกความคุ้มครองไว้ยาว' }
: { name: 'ประกันชีวิตตลอดชีพ', why: 'ใช้วางแผนส่งต่อมรดกให้คนที่คุณรัก' };
} else {
main = st === 'retire'
? { name: 'บำนาญ', why: 'มีรายได้ประจำทุกปีหลังเลิกทำงาน' }
: st === 'family'
? { name: 'สะสมทรัพย์', why: 'ออมให้ตรงเป้า เช่น ทุนการศึกษาลูก' }
: { name: 'สะสมทรัพย์ / Unit Linked', why: 'สร้างวินัยการออม และเริ่มลงทุนระยะยาว' };
}
const extra = wo !== 'health'
? { name: 'ประกันสุขภาพ', why: 'ฐานที่ควรมีก่อน เพื่อไม่ให้แผนอื่นสะดุดเมื่อเจ็บป่วย' }
