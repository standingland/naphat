<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ติดต่อ — พัด ดูแลประกัน</title><meta name="description" content="เทมเพลตเว็บไซต์ที่ปรึกษาประกัน — Trusted Red"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1D21}a:hover{color:#4A4E57}
</style></head><body><div id="app"></div><template id="t"><div style="background:#FFFFFF;color:#1C1D21;font-family:'Anuphan', system-ui, sans-serif;line-height:1.65"><div style="background:#1C1D21;color:#D9D6D2;font-size:13px"><div style="max-width:1200px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px"><span style="display:inline-flex;align-items:center;gap:8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>ตัวแทนประกันชีวิตที่ได้รับใบอนุญาต · เลขที่ [—] · IC License [—]</span><span>โทร [0XX-XXX-XXXX] · LINE [@lineid]</span></div></div><header style="border-bottom:1px solid #ECE8E4"><div style="max-width:1200px;margin:0 auto;padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px"><a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#1C1D21"><span aria-hidden="true" style="width:42px;height:42px;border-radius:50%;background:{{accent}};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px">พ</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:700;font-size:20px">พัด ดูแลประกัน</span><span style="font-size:12px;color:#4A4E57">ที่ปรึกษาประกันชีวิตและสุขภาพ</span></span></a><nav aria-label="เมนูหลัก" style="display:flex;flex-wrap:wrap;gap:4px 8px"><a href="/" style="padding:10px 16px;border-radius:999px;color:#1C1D21;text-decoration:none;font-size:15px">หน้าแรก</a><a href="/about" style="padding:10px 16px;border-radius:999px;color:#1C1D21;text-decoration:none;font-size:15px">รู้จักเรา</a><a href="/plans" style="padding:10px 16px;border-radius:999px;color:#1C1D21;text-decoration:none;font-size:15px">แผนประกัน</a><a href="/blog" style="padding:10px 16px;border-radius:999px;color:#1C1D21;text-decoration:none;font-size:15px">บทความ</a></nav><a href="/contact" style="display:inline-flex;align-items:center;min-height:48px;box-sizing:border-box;padding:12px 24px;background:{{accent}};color:#FFFFFF;border-radius:999px;text-decoration:none;font-weight:600">นัดปรึกษาฟรี</a></div></header><section style="max-width:1200px;margin:0 auto;padding:48px 24px 88px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start"><div style="flex:1 1 380px;min-width:0"><span style="display:inline-block;padding:8px 16px;background:#F6F4F2;border-radius:999px;font-size:14px;font-weight:500;margin-bottom:20px">ติดต่อเรา</span><h1 style="margin:0 0 16px;font-weight:700;font-size:clamp(36px, 4.4vw, 52px);line-height:1.25">ทักมาคุยกันได้เลย<br>ฟรี ไม่ต้องเกรงใจ</h1><p style="margin:0 0 32px;font-size:18px;color:#4A4E57">เลือกช่องทางที่สะดวก หรือกรอกฟอร์ม แล้วเราจะติดต่อกลับภายใน [X] ชั่วโมง</p><div style="display:flex;flex-direction:column;gap:12px"><a href="/contact" style="display:flex;align-items:center;gap:16px;padding:18px 20px;background:#F6F4F2;border-radius:24px;text-decoration:none;color:#1C1D21"><span aria-hidden="true" style="flex-shrink:0;width:48px;height:48px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1D21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5A8.4 8.4 0 1 1 21 11.5z"></path></svg></span><span style="display:flex;flex-direction:column"><span style="font-size:13px;color:#4A4E57">LINE · ตอบไวที่สุด</span><strong style="font-size:18px">[@lineid]</strong></span></a><a href="/contact" style="display:flex;align-items:center;gap:16px;padding:18px 20px;background:#FCEBEF;border-radius:24px;text-decoration:none;color:#1C1D21"><span aria-hidden="true" style="flex-shrink:0;width:48px;height:48px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1D21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span><span style="display:flex;flex-direction:column"><span style="font-size:13px;color:#4A4E57">โทร</span><strong style="font-size:18px">[0XX-XXX-XXXX]</strong></span></a><a href="/contact" style="display:flex;align-items:center;gap:16px;padding:18px 20px;background:#F6F4F2;border-radius:24px;text-decoration:none;color:#1C1D21"><span aria-hidden="true" style="flex-shrink:0;width:48px;height:48px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1D21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3 7 9 6 9-6"></path></svg></span><span style="display:flex;flex-direction:column"><span style="font-size:13px;color:#4A4E57">อีเมล</span><strong style="font-size:18px">[email@domain.com]</strong></span></a><div style="display:flex;align-items:center;gap:16px;padding:18px 20px;background:#FFFFFF;border:1px solid #ECE8E4;border-radius:24px"><span aria-hidden="true" style="flex-shrink:0;width:48px;height:48px;border-radius:50%;background:#F6F4F2;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1D21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span style="display:flex;flex-direction:column"><span style="font-size:13px;color:#4A4E57">เวลาให้คำปรึกษา</span><strong style="font-size:18px">[วัน–วัน · __:__–__:__ น.]</strong></span></div><span aria-hidden="true" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;background:#F6F4F2;border:1.5px dashed #D9D4CE;border-radius:24px;color:#A8A29B;font-size:13px;text-align:center;box-sizing:border-box;margin-top:12px"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg>[ภาพสถานที่นัดพบ / แผนที่]</span></div></div><div style="flex:1 1 520px;min-width:0;background:#FFFFFF;border:1px solid #ECE8E4;border-radius:40px;padding:clamp(28px, 4vw, 48px)"><sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><div role="status" style="display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding:48px 0"><span aria-hidden="true" style="width:80px;height:80px;border-radius:50%;background:#F6F4F2;display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1C1D21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span><h2 style="margin:0;font-weight:700;font-size:32px">ได้รับแล้ว ขอบคุณนะครับ</h2><p style="margin:0;color:#4A4E57;max-width:380px">จะติดต่อกลับภายใน [X] ชั่วโมง ระหว่างนี้แอด LINE ไว้ก่อนได้เลย</p><button type="button" onClick="{{reset}}" style="min-height:48px;padding:12px 24px;border:2px solid #ECE8E4;background:#FFFFFF;color:#1C1D21;border-radius:999px;font-family:inherit;font-size:16px;cursor:pointer">ส่งอีกครั้ง</button></div></sc-if><sc-if value="{{notSent}}" hint-placeholder-val="{{true}}"><form style="display:flex;flex-direction:column;gap:22px"><h2 style="margin:0;font-weight:700;font-size:28px">จองเวลาคุยฟรี</h2><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:18px"><div style="display:flex;flex-direction:column;gap:6px"><label for="w-name" style="font-size:15px;font-weight:600">ชื่อเล่น</label><input id="w-name" type="text" autocomplete="nickname" style="min-height:52px;padding:12px 18px;border:2px solid #ECE8E4;border-radius:16px;font-family:inherit;font-size:16px;background:#FFFFFF;color:#1C1D21"></div><div style="display:flex;flex-direction:column;gap:6px"><label for="w-phone" style="font-size:15px;font-weight:600">เบอร์โทร</label><input id="w-phone" type="tel" autocomplete="tel" style="min-height:52px;padding:12px 18px;border:2px solid #ECE8E4;border-radius:16px;font-family:inherit;font-size:16px;background:#FFFFFF;color:#1C1D21"></div><div style="display:flex;flex-direction:column;gap:6px"><label for="w-line" style="font-size:15px;font-weight:600">LINE ID (ถ้ามี)</label><input id="w-line" type="text" style="min-height:52px;padding:12px 18px;border:2px solid #ECE8E4;border-radius:16px;font-family:inherit;font-size:16px;background:#FFFFFF;color:#1C1D21"></div><div style="display:flex;flex-direction:column;gap:6px"><label for="w-time" style="font-size:15px;font-weight:600">สะดวกคุยช่วงไหน</label><select id="w-time" style="min-height:52px;padding:12px 18px;border:2px solid #ECE8E4;border-radius:16px;font-family:inherit;font-size:16px;background:#FFFFFF;color:#1C1D21"><option>วันธรรมดา ช่วงเย็น</option><option>วันธรรมดา ช่วงกลางวัน</option><option>เสาร์–อาทิตย์</option></select></div></div><fieldset style="border:none;margin:0;padding:0"><legend style="font-size:15px;font-weight:600;padding:0;margin-bottom:10px">อยากคุยเรื่องไหน (เลือกได้หลายข้อ)</legend><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{topics}}" as="t" hint-placeholder-count="6"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></fieldset><div style="display:flex;flex-direction:column;gap:6px"><label for="w-msg" style="font-size:15px;font-weight:600">เล่าเพิ่มนิดหน่อย (ไม่บังคับ)</label><textarea id="w-msg" rows="4" style="padding:14px 18px;border:2px solid #ECE8E4;border-radius:16px;font-family:inherit;font-size:16px;background:#FFFFFF;color:#1C1D21;resize:vertical"></textarea></div><button type="button" onClick="{{submit}}" style="min-height:56px;padding:16px 30px;background:{{accent}};color:#FFFFFF;border:none;border-radius:999px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer">ส่งเลย</button><p style="margin:0;font-size:13px;color:#4A4E57;text-align:center">ข้อมูลใช้เพื่อติดต่อกลับเท่านั้น [ลิงก์นโยบายความเป็นส่วนตัว]</p></form></sc-if></div></section><footer style="background:#1C1D21;color:#D9D6D2;font-size:13px"><div style="max-width:1200px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:6px"><strong style="font-size:18px;color:#FFFFFF">พัด ดูแลประกัน</strong><span>[ชื่อ-นามสกุล] · รหัสตัวแทน [—] · ใบอนุญาต [—] · IC License [—]</span><span>ประกันมีความเสี่ยง ผู้ซื้อควรทำความเข้าใจรายละเอียดความคุ้มครองและเงื่อนไขก่อนตัดสินใจทำประกันภัยทุกครั้ง</span><span>เว็บไซต์ส่วนตัวของตัวแทน ไม่ใช่เว็บไซต์ทางการของ [ชื่อบริษัทประกัน]</span></div></footer></div></template><script id="c" type="text/plain">class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: ['ประกันสุขภาพ'], sent: false };
}
renderVals() {
const tints = ['#FCEBEF', '#F6F4F2', '#F6F4F2', '#FCEBEF', '#F6F4F2', '#FCEBEF'];
const names = ['ประกันสุขภาพ', 'ประกันชีวิต', 'ออมเงิน', 'เกษียณ', 'ลดหย่อนภาษี', 'เช็กกรมธรรม์เดิม'];
const base = 'min-height: 44px; padding: 10px 18px; border-radius: 999px; font-family: inherit; font-size: 15px; cursor: pointer; ';
const topics = names.map((n, i) => {
const on = this.state.picked.indexOf(n) !== -1;
return {
label: n,
pressed: on ? 'true' : 'false',
style: base + (on ? 'background: #1C1D21; color: #FFFFFF; border: 2px solid #1C1D21;' : 'background: ' + tints[i] + '; color: #1C1D21; border: 2px solid ' + tints[i] + ';'),
toggle: () => this.setState({ picked: on ? this.state.picked.filter((x) => x !== n) : this.state.picked.concat([n]) })
};
});
return {
accent: this.props.accent ?? '#D31145',
topics: topics,
sent: this.state.sent,
notSent: !this.state.sent,
submit: () => this.setState({ sent: true }),
reset: () => this.setState({ sent: false })
};
}
}</script><script src="/rt.js"></script></body></html>
