-weight:700;font-size:clamp(28px, 3vw, 40px);text-align:center">เบี้ยประมาณเท่าไหร่?</h2><p style="margin:0 0 32px;text-align:center;color:#4A4E57">ตัวอย่างคร่าว ๆ ตัวเลขจริงขึ้นกับอายุ สุขภาพ และแผนที่เลือก</p><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:16px"><div style="background:#FFFFFF;border:1px solid #ECE8E4;border-radius:28px;padding:28px;text-align:center"><div style="font-size:14px;color:#4A4E57">อายุ [__] ปี · [ชื่อแผน]</div><div style="font-weight:700;font-size:32px;margin:8px 0">฿[__]<span style="font-size:16px;font-weight:500"> /ปี</span></div><div style="font-size:14px;color:#4A4E57">วงเงิน ฿[__] ต่อปี</div></div><div style="background:#1C1D21;color:#FFFFFF;border-radius:28px;padding:28px;text-align:center"><div style="font-size:14px">อายุ [__] ปี · [ชื่อแผน]</div><div style="font-weight:700;font-size:32px;margin:8px 0">฿[__]<span style="font-size:16px;font-weight:500"> /ปี</span></div><div style="font-size:14px">วงเงิน ฿[__] ต่อปี</div></div><div style="background:#FFFFFF;border:1px solid #ECE8E4;border-radius:28px;padding:28px;text-align:center"><div style="font-size:14px;color:#4A4E57">อายุ [__] ปี · [ชื่อแผน]</div><div style="font-weight:700;font-size:32px;margin:8px 0">฿[__]<span style="font-size:16px;font-weight:500"> /ปี</span></div><div style="font-size:14px;color:#4A4E57">วงเงิน ฿[__] ต่อปี</div></div></div></section><section style="max-width:860px;margin:0 auto;padding:0 24px 88px"><h2 style="margin:0 0 24px;font-weight:700;font-size:clamp(28px, 3vw, 40px);text-align:center">คำถามยอดฮิต</h2><div style="display:flex;flex-direction:column;gap:12px"><sc-for list="{{faqs}}" as="item" hint-placeholder-count="5"><div style="background:#FFFFFF;border:1px solid #ECE8E4;border-radius:24px;padding:0 24px"><button type="button" aria-expanded="{{item.expanded}}" onClick="{{item.toggle}}" style="width:100%;min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;background:none;border:none;text-align:left;font-family:inherit;font-size:17px;font-weight:600;color:#1C1D21;cursor:pointer"><span>{{item.q}}</span><span aria-hidden="true" style="flex-shrink:0;width:32px;height:32px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:20px;color:{{accent}}">{{item.sign}}</span></button><sc-if value="{{item.open}}" hint-placeholder-val="{{false}}"><p style="margin:0;padding:0 0 20px;color:#4A4E57">{{item.a}}</p></sc-if></div></sc-for></div></section><section style="max-width:1200px;margin:0 auto;padding:0 24px 88px"><h2 style="margin:0 0 20px;font-weight:700;font-size:26px">มักทำคู่กับ</h2><div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:48px"><a href="/plan-detail" style="display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:12px 24px;background:#F6F4F2;border-radius:999px;text-decoration:none;color:#1C1D21;font-weight:600">ตลอดชีพ →</a><a href="/plan-detail" style="display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:12px 24px;background:#F6F4F2;border-radius:999px;text-decoration:none;color:#1C1D21;font-weight:600">Term →</a><a href="/plan-detail" style="display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:12px 24px;background:#F6F4F2;border-radius:999px;text-decoration:none;color:#1C1D21;font-weight:600">สะสมทรัพย์ →</a></div><div style="background:{{accent}};color:#FFFFFF;border-radius:40px;padding:clamp(36px, 5vw, 64px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px"><div style="flex:1 1 420px;min-width:0"><h2 style="margin:0 0 8px;font-weight:700;font-size:clamp(28px, 3vw, 40px)">ขอใบเสนอราคาของคุณเอง</h2><p style="margin:0;font-size:17px">บอกอายุกับงบที่สบายใจ แล้วเราคำนวณให้ ฟรี</p></div><a href="/contact" style="display:inline-flex;align-items:center;min-height:56px;box-sizing:border-box;padding:16px 30px;background:#FFFFFF;color:#1C1D21;border-radius:999px;text-decoration:none;font-weight:600;font-size:17px">ขอใบเสนอราคา</a></div></section><footer style="background:#1C1D21;color:#D9D6D2;font-size:13px"><div style="max-width:1200px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:6px"><strong style="font-size:18px;color:#FFFFFF">พัด ดูแลประกัน</strong><span>[ชื่อ-นามสกุล] · รหัสตัวแทน [—] · ใบอนุญาต [—] · IC License [—]</span><span>ประกันมีความเสี่ยง ผู้ซื้อควรทำความเข้าใจรายละเอียดความคุ้มครองและเงื่อนไขก่อนตัดสินใจทำประกันภัยทุกครั้ง</span><span>เว็บไซต์ส่วนตัวของตัวแทน ไม่ใช่เว็บไซต์ทางการของ [ชื่อบริษัทประกัน]</span></div></footer></div></template><script id="c" type="text/plain">class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 0 };
}
renderVals() {
const list = [
{ q: 'มีโรคประจำตัว ทำได้ไหม?', a: 'ขึ้นกับโรคและการพิจารณาของบริษัทประกัน บางกรณีรับได้โดยยกเว้นเฉพาะโรคนั้น เราช่วยเตรียมข้อมูลสุขภาพให้ครบ' },
{ q: 'ระยะรอคอยคืออะไร?', a: 'ช่วงแรกหลังเริ่มกรมธรรม์ที่บางโรคยังไม่คุ้มครอง ระยะเวลาต่างกันตามแผน ควรอ่านในเอกสารเสนอขาย' },
{ q: 'มีประกันบริษัทแล้ว ต้องทำเพิ่มไหม?', a: 'ถ้าวงเงินบริษัทน้อยกว่าค่ารักษาโรคใหญ่ หรือมีแผนเปลี่ยนงาน การมีประกันส่วนตัวช่วยให้ความคุ้มครองไม่ขาดช่วง' },
{ q: 'ลดหย่อนภาษีได้ไหม?', a: 'ได้ตามเงื่อนไขของกรมสรรพากร และมีเพดานแยกจากประกันชีวิต ควรเช็กประกาศล่าสุด' },
{ q: 'เคลมยุ่งยากไหม?', a: 'โรงพยาบาลคู่สัญญาส่วนใหญ่ใช้บัตรได้เลยโดยไม่ต้องสำรองจ่าย และเราช่วยตามเคลมให้ทุกครั้ง' }
];
const faqs = list.map((f, i) => {
const open = this.state.open === i;
return { q: f.q, a: f.a, open: open, expanded: open ? 'true' : 'false', sign: open ? '−' : '+', toggle: () => this.setState({ open: open ? -1 : i }) };
});
return { accent: this.props.accent ?? '#D31145', faqs: faqs };
}
}</script><script src="/rt.js"></script></body></html>
